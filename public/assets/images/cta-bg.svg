<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <rect width="100%" height="100%" fill="#1f1f1f"/>
  <rect width="100%" height="100%" fill="url(#grain)" opacity="0.04"/>
  <defs>
    <pattern id="grain" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#1f1f1f"/>
      <circle cx="1" cy="1" r="0.5" fill="#ffffff" opacity="0.3"/>
    </pattern>
  </defs>
  <text x="50%" y="50%" font-family="Helvetica, Arial, sans-serif" font-size="77" fill="#e8e6e1" fill-opacity="0.55" text-anchor="middle" dominant-baseline="middle" letter-spacing="2">CTA BG</text>
  <text x="50%" y="calc(50% + 77px)" font-family="Helvetica, Arial, sans-serif" font-size="34.0" fill="#e8e6e1" fill-opacity="0.35" text-anchor="middle" dominant-baseline="middle">1920 x 1080 PLACEHOLDER</text>
</svg>