<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
  <rect width="100%" height="100%" fill="#3a3a3a"/>
  <rect width="100%" height="100%" fill="url(#grain)" opacity="0.04"/>
  <defs>
    <pattern id="grain" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#3a3a3a"/>
      <circle cx="1" cy="1" r="0.5" fill="#ffffff" opacity="0.3"/>
    </pattern>
  </defs>
  <text x="50%" y="50%" font-family="Helvetica, Arial, sans-serif" font-size="57" fill="#e8e6e1" fill-opacity="0.55" text-anchor="middle" dominant-baseline="middle" letter-spacing="2">INTRO PHOTO</text>
  <text x="50%" y="calc(50% + 57px)" font-family="Helvetica, Arial, sans-serif" font-size="25.0" fill="#e8e6e1" fill-opacity="0.35" text-anchor="middle" dominant-baseline="middle">800 x 1000 PLACEHOLDER</text>
</svg>