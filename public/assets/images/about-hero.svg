<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="100%" height="100%" fill="#2b2b2b"/>
  <rect width="100%" height="100%" fill="url(#grain)" opacity="0.04"/>
  <defs>
    <pattern id="grain" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#2b2b2b"/>
      <circle cx="1" cy="1" r="0.5" fill="#ffffff" opacity="0.3"/>
    </pattern>
  </defs>
  <text x="50%" y="50%" font-family="Helvetica, Arial, sans-serif" font-size="64" fill="#e8e6e1" fill-opacity="0.55" text-anchor="middle" dominant-baseline="middle" letter-spacing="2">ABOUT HERO</text>
  <text x="50%" y="calc(50% + 64px)" font-family="Helvetica, Arial, sans-serif" font-size="29.0" fill="#e8e6e1" fill-opacity="0.35" text-anchor="middle" dominant-baseline="middle">1600 x 900 PLACEHOLDER</text>
</svg>